spring.application.name=api-management-service
server.port=8081
info.app.name=Api Management Service
info.app.description=Custom API gateway for routing ,security,and traffic management
spring.datasource.url=jdbc:mysql://localhost:3306/gatekeeper_management
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
security.jwt.expiration-seconds=3600
security.jwt.secret=gatekeeper-demo-jwt-secret-key-change-before-production


gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}
